<title>Druckfarm</title>
<style>

<body>
<canvas id="game"></canvas>
<script src="config.js"></script>
<script>
'use strict';
// Druckfarm: a 3D-printer business tycoon. Walk the workshop, keep each printer fed and
// maintained, pack and ship what it prints, automate printer by printer.
//
// Built to map onto Roblox one to one (the port is a translation, not a redesign):
//   config.js            -> ReplicatedStorage.Config (ModuleScript): every number
//   ECONOMY / PRINTERS   -> ServerScriptService services: all money, prints and wear run on the
//                           server; the client only asks ("start", "refill", "pack", "ship")
//   one printer object   -> one printer Model on the plot, its state in attributes
//   prompts()            -> ProximityPrompts on each printer and station (E, F, R, Q, T, U)
//   player.x / player.y  -> the Roblox character; walking is Humanoid movement
//   panel                -> ScreenGui that opens when a prompt is in range
//   save()               -> DataStore per player at the end of each day

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value });
const STEP = 1 / 60;
const W = 1280, H = 720;
const FONT = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const TITLE = 'Druckfarm';
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H), r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function fillRR(x, y, w, h, r, c) { rr(x, y, w, h, r); ctx.fillStyle = c; ctx.fill(); }
function poly(pts, c) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); if (c) { ctx.fillStyle = c; ctx.fill(); }
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function ell(x, y, rx, ry, c) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function eur(n) {
  const neg = n < 0, v = Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '−' : '') + v + ' €';
}
function pct(f) { return Math.round(f * 100) + ' %'; }
function num(f, d = 1) { return f.toFixed(d).replace('.', ','); }

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
const held = code => down.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
const mouse = { x: -1, y: -1, in: false };
const clicks = [];
function toLogical(e) {
  const b = canvas.getBoundingClientRect();
  return { x: (e.clientX - b.left) / b.width * W, y: (e.clientY - b.top) / b.height * H };
}
canvas.addEventListener('pointerdown', e => { startAudio(); const p = toLogical(e); clicks.push(p); });
canvas.addEventListener('pointermove', e => { const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true; });
canvas.addEventListener('pointerleave', () => { mouse.in = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault(); const p = toLogical(e);
  if (inFloor(p)) cam.zoom = clamp(cam.zoom * Math.exp(-e.deltaY * 0.0012), 1, 1.9);
}, { passive: false });

// ---- Audio --------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {
  coin() { tone(880, 0.08, 'triangle', 0.18); tone(1320, 0.12, 'triangle', 0.15, 0.06); },
  done() { tone(660, 0.07, 'triangle', 0.12); },
  buy() { tone(330, 0.06, 'square', 0.12); tone(220, 0.1, 'square', 0.12, 0.05); },
  click() { tone(600, 0.04, 'square', 0.08); },
  fail() { tone(200, 0.2, 'sawtooth', 0.12); },
  clog() { tone(110, 0.35, 'sawtooth', 0.2); tone(90, 0.4, 'sawtooth', 0.15, 0.15); },
  fixed() { tone(520, 0.08, 'triangle', 0.15); tone(780, 0.12, 'triangle', 0.15, 0.08); },
  goal() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'triangle', 0.18, i * 0.09)); },
  bad() { tone(160, 0.3, 'square', 0.12); },
  van() { tone(140, 0.5, 'sawtooth', 0.08); tone(180, 0.4, 'sawtooth', 0.06, 0.2); },
};

// ---- Data tables (numbers come from config.js) ------------------------------------------
const FIL = ['cheap', 'plus', 'petg', 'resin'];
const FIL_NAME = { cheap: 'Billig-PLA', plus: 'PLA+', petg: 'PETG', resin: 'Resin' };
const FIL_SHORT = { cheap: 'Billig', plus: 'PLA+', petg: 'PETG', resin: 'Resin' };
const FIL_COLOR = { cheap: '#e7d3a1', plus: '#3d84f0', petg: '#1fbfa2', resin: '#a45cf2' };
const FIL_TIER = { cheap: 0, plus: 0, petg: 1, resin: 2 };
function filDef(id) {
  return { id, name: FIL_NAME[id], color: FIL_COLOR[id], tier: FIL_TIER[id],
    price: tune[`fil_${id}_price`], fail: tune[`fil_${id}_fail`], value: tune[`fil_${id}_value`] };
}
const OBJ = ['key', 'holder', 'dragon', 'gear', 'helmet', 'drone'];
const OBJ_NAME = { key: 'Schlüsselanhänger', holder: 'Handyhalter', dragon: 'Drachenfigur', gear: 'Zahnrad-Ersatzteil', helmet: 'Cosplay-Helm', drone: 'Drohnenrahmen' };
const OBJ_SHORT = { key: 'Anhänger', holder: 'Handyhalter', dragon: 'Drache', gear: 'Zahnrad', helmet: 'Helm', drone: 'Drohne' };
const OBJ_TIER = { key: 0, holder: 0, dragon: 0, gear: 1, helmet: 1, drone: 2 };
const OBJ_H = { key: 11, holder: 26, dragon: 34, gear: 34, helmet: 38, drone: 18 };
function objDef(id) {
  return { id, name: OBJ_NAME[id], tier: OBJ_TIER[id], h: OBJ_H[id],
    g: tune[`obj_${id}_g`], time: tune[`obj_${id}_time`], price: tune[`obj_${id}_price`], plan: tune[`obj_${id}_plan`] };
}
const TIER_NAME = ['Starter', 'Pro', 'Industrie'];
const TIER_KEY = ['starter', 'pro', 'ind'];
function tierDef(t) {
  const k = TIER_KEY[t];
  return { name: TIER_NAME[t], speed: tune[`pr_${k}_speed`], wear: tune[`pr_${k}_wear`],
    maint: tune[`pr_${k}_maint`], repair: tune[`pr_${k}_repair`],
    upgrade: t === 0 ? tune.pr_pro_upgrade : t === 1 ? tune.pr_ind_upgrade : 0 };
}

// ---- Layout (world coordinates) -------------------------------------------------------------
const FX0 = 0, FY0 = 56, FW = 830, FH = 664, FCX = FX0 + FW / 2, FCY = FY0 + FH / 2;
const BW = 128, BD = 28, BS = 18, PS = 0.8; // bench width, depth, skew; printer drawing scale
const cam = { zoom: 1, cx: FCX, cy: FCY };
function clampCam() {
  const hw = FW / 2 / cam.zoom, hh = FH / 2 / cam.zoom;
  cam.cx = clamp(cam.cx, FX0 + hw, FX0 + FW - hw); cam.cy = clamp(cam.cy, FY0 + hh, FY0 + FH - hh);
}
function inFloor(p) { return p.x >= FX0 && p.x < FX0 + FW && p.y >= FY0 && p.y < FY0 + FH; }
function toWorld(x, y) { return { x: (x - FCX) / cam.zoom + cam.cx, y: (y - FCY) / cam.zoom + cam.cy }; }
function slotPos(i) {
  const row = i < 4 ? 0 : 1, col = i % 4;
  const x0 = 222 + col * 150, ty = row === 0 ? 405 : 625;
  const bx = x0 + BW / 2 + BS / 2;
  return { x0, ty, bx, by: ty - BD / 2 + 3, px: x0 + BW / 2, py: ty + 44 };
}
// stations: prompt point (px, py) and the footprint the player cannot walk through
const STATION = {
  ship: { name: 'Versandtor', px: 105, py: 272, foot: null },
  pack: { name: 'Packtisch', px: 105, py: 478, foot: [26, 398, 178, 446] },
  store: { name: 'Lager-Regal', px: 105, py: 590, foot: [26, 612, 178, 656] },
};
const BOUNDS = [14, 252, 816, 712];
function footprints() {
  const f = [];
  for (let i = 0; i < 8; i++) { const s = slotPos(i); f.push([s.x0 - 2, s.ty - BD - 6, s.x0 + BW + BS + 2, s.ty + 24]); }
  for (const k in STATION) if (STATION[k].foot) f.push(STATION[k].foot);
  return f;
}
const FOOT = footprints();

// ---- State ---------------------------------------------------------------------------------
const SAVE_KEY = 'druckfarm-save-v2';
let scene, state, anim = 0, ui = [];
function newPrinter(slot, tier = 0) {
  return { slot, tier, wear: 0, job: 'key', fil: 'cheap', spool: { type: 'cheap', g: 0 }, status: 'idle', prog: 0, timer: 0,
    auto: false, maintQueued: false, cur: null, why: '', held: null, autoMaint: false, autoFeed: false };
}
function freshToday() {
  return { inc: 0, out: { Filament: 0, Wartung: 0, Reparatur: 0, Drucker: 0, Baupläne: 0, Upgrades: 0, Automatik: 0, Kartons: 0, Lager: 0 }, prints: 0, fails: 0, clogs: 0, shipped: 0 };
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  const p0 = newPrinter(0); p0.spool.g = tune.start_filament;
  const s0 = slotPos(0);
  state = {
    t: 0, score: 0, gained: '',
    money: tune.start_money, day: 1, dayT: 0, warn: false,
    printers: [p0],
    plans: { key: true, holder: false, dragon: false, gear: false, helmet: false, drone: false },
    stats: { prints: 0, fails: 0, clogs: 0, maint: 0, repairs: 0, earned: 0, bestDay: 0, refills: 0, packed: 0, shipped: 0, autos: 0,
      byFil: { cheap: 0, plus: 0, petg: 0, resin: 0 } },
    today: freshToday(), ledger: [], ms: 0, big: 0, summary: null, stuckT: 0, started: false,
    store: [], storeLvl: 0, packQ: [], packT: 0, packed: [], truck: { st: 'dock', t: 0, value: 0, n: 0 }, autoShip: false, autoShipT: 0,
    player: { x: s0.px, y: s0.py + 6, dir: 1, walk: 0, moving: false, to: null },
    near: null,
    fx: [], flying: [], confetti: [], banner: null, overReason: '',
  };
  cam.zoom = 1; cam.cx = FCX; cam.cy = FCY;
}
function save() {
  try {
    const s = Object.assign({}, state, { fx: [], flying: [], confetti: [], banner: null, near: null, seedNow: seed });
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  } catch (e) { /* storage blocked: the game plays without saving */ }
}
function loadSave() {
  try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }
function continueGame(s) {
  reset(); Object.assign(state, s); if (s.seedNow) seed = s.seedNow;
  state.fx = []; state.flying = []; state.confetti = []; state.banner = null; state.player.to = null; scene = 'play';
}

// ---- ECONOMY (server side in Roblox) ---------------------------------------------------------
const maxTier = () => state.printers.reduce((m, p) => Math.max(m, p.tier), 0);
const nextPrice = () => Math.round(tune.printer_base_price * Math.pow(tune.printer_price_growth, state.printers.length - 1));
const rentToday = () => Math.round((tune.rent_base + tune.rent_per_printer * state.printers.length) * Math.pow(tune.rent_growth, state.day - 1));
const storeCap = () => tune.store_cap + tune.store_cap_add * state.storeLvl;
const storeUpPrice = () => Math.round(tune.store_up_price * Math.pow(2, state.storeLvl));
const printerAt = slot => state.printers.find(p => p.slot === slot);
function ledger(textS, amt) {
  state.ledger.unshift({ text: textS, amt, t: state.t });
  if (state.ledger.length > 6) state.ledger.pop();
}
function spend(cat, amt, label) {
  if (state.money < amt) { sfx.bad(); return false; }
  state.money -= amt; state.today.out[cat] = (state.today.out[cat] || 0) + amt; ledger(label, -amt); return true;
}
function earn(amt, label) {
  state.money += amt; state.today.inc += amt; state.stats.earned += amt; state.score = Math.round(state.stats.earned);
  ledger(label, amt);
}
function fx(x, y, s, c) { state.fx.push({ x, y, s, c, t: 0, life: 1.6 }); }
function fxAt(p, s, c) { const sp = slotPos(p.slot); fx(sp.bx, sp.by - 150, s, c); }

// ---- PRINTERS (server side in Roblox) -----------------------------------------------------------
function refill(p, auto = false) {
  if (!p) return false;
  const f = filDef(p.fil);
  if (f.tier > p.tier) { sfx.bad(); return false; }
  const swap = p.spool.type !== p.fil && p.spool.g > 0;
  if (!swap && p.spool.g + tune.pack_grams > tune.spool_max) { if (!auto) { fxAt(p, 'Spule ist voll', '#f3b25b'); sfx.bad(); } return false; }
  if (!spend('Filament', f.price, `${auto ? 'Zuführung' : 'Filament'} #${p.slot + 1}: ${f.name} +${tune.pack_grams} g`)) return false;
  if (swap) { fxAt(p, `Spule gewechselt, ${Math.round(p.spool.g)} g weg`, '#f3b25b'); p.spool.g = 0; }
  p.spool.type = p.fil; p.spool.g += tune.pack_grams; state.stats.refills++;
  if (!auto) sfx.buy();
  if (p.status === 'wait' && p.auto) tryStart(p);
  return true;
}
function tryStart(p) {
  const o = objDef(p.job), f = filDef(p.spool.type);
  if (!state.plans[p.job] || o.tier > p.tier) { p.status = 'wait'; p.why = 'Auftrag passt nicht'; return false; }
  if (p.spool.g < o.g && p.autoFeed && state.money >= filDef(p.fil).price) refill(p, true);
  if (p.spool.g < o.g) { p.status = 'wait'; p.why = 'Spule leer'; return false; }
  if (f.tier > p.tier) { p.status = 'wait'; p.why = 'Filament passt nicht'; return false; }
  p.spool.g -= o.g; p.status = 'print'; p.prog = 0; p.cur = { job: p.job, fil: p.spool.type }; p.why = '';
  return true;
}
function toggleRun(p) {
  if (!p) return;
  state.started = true;
  if (p.auto) { p.auto = false; if (p.status === 'wait') p.status = 'idle'; sfx.click(); return; }
  p.auto = true; sfx.click();
  if (p.status === 'idle' || p.status === 'wait') tryStart(p);
}
function startMaint(p, label) {
  if (!spend('Wartung', tierDef(p.tier).maint, label || `Wartung #${p.slot + 1}`)) return false;
  p.status = 'maint'; p.timer = 0; state.stats.maint++; return true;
}
function doMaint(p) {
  if (!p) return;
  if (p.status === 'clog') { doRepair(p); return; }
  if (p.status === 'maint' || p.status === 'repair' || p.status === 'held') return;
  if (p.status === 'print') { if (state.money >= tierDef(p.tier).maint) { p.maintQueued = !p.maintQueued; sfx.click(); } else sfx.bad(); return; }
  if (startMaint(p)) sfx.click();
}
function doRepair(p) {
  if (!p || p.status !== 'clog') return;
  if (!spend('Reparatur', tierDef(p.tier).repair, `Reparatur #${p.slot + 1}`)) return;
  p.status = 'repair'; p.timer = 0; state.stats.repairs++; sfx.click();
}
function doUpgrade(p) {
  if (!p || p.tier >= 2 || p.status === 'print' || p.status === 'maint' || p.status === 'repair') return;
  if (!spend('Upgrades', tierDef(p.tier).upgrade, `Upgrade #${p.slot + 1} auf ${TIER_NAME[p.tier + 1]}`)) return;
  p.tier++; p.wear = 0; if (p.status !== 'held') p.status = 'idle'; sfx.buy();
  fxAt(p, TIER_NAME[p.tier] + '!', '#ffd166');
  if (p.auto && p.status === 'idle') tryStart(p);
}
function buyAuto(p, kind) {
  if (!p) return;
  if (kind === 'maint' && !p.autoMaint) { if (spend('Automatik', tune.auto_maint_price, `Wartungs-Roboter #${p.slot + 1}`)) { p.autoMaint = true; state.stats.autos++; sfx.buy(); fxAt(p, 'Wartungs-Roboter!', '#ffd166'); } }
  if (kind === 'feed' && !p.autoFeed) { if (spend('Automatik', tune.auto_feed_price, `Filament-Zuführung #${p.slot + 1}`)) { p.autoFeed = true; state.stats.autos++; sfx.buy(); fxAt(p, 'Filament-Zuführung!', '#ffd166'); if (p.status === 'wait' && p.auto) tryStart(p); } }
}
function buyPrinter(slot) {
  if (state.printers.length >= 8 || printerAt(slot)) return;
  if (!spend('Drucker', nextPrice(), `Neuer Drucker #${slot + 1}`)) return;
  state.printers.push(newPrinter(slot)); sfx.buy();
  const s = slotPos(slot); fx(s.bx, s.by - 120, 'Neuer Drucker! Spule leer: F', '#7ee08f');
}
function buyPlan(o) {
  if (state.plans[o]) return;
  if (!spend('Baupläne', objDef(o).plan, `Bauplan ${OBJ_NAME[o]}`)) return;
  state.plans[o] = true; sfx.buy();
}
function chooseJob(p, o) {
  if (!state.plans[o]) { buyPlan(o); if (!state.plans[o]) return; }
  if (OBJ_TIER[o] > p.tier) { sfx.bad(); return; }
  p.job = o; sfx.click();
  if (p.status === 'wait' && p.auto) tryStart(p);
}
function cycleJob(p) {
  const ok = OBJ.filter(o => state.plans[o] && OBJ_TIER[o] <= p.tier);
  p.job = ok[(ok.indexOf(p.job) + 1) % ok.length]; sfx.click();
  if (p.status === 'wait' && p.auto) tryStart(p);
}
function chooseFil(p, f) { if (FIL_TIER[f] > p.tier) { sfx.bad(); return; } p.fil = f; sfx.click(); }
function cycleFil(p) { const ok = FIL.filter(f => FIL_TIER[f] <= p.tier); p.fil = ok[(ok.indexOf(p.fil) + 1) % ok.length]; sfx.click(); }

// ---- STORAGE AND SHIPPING (server side in Roblox) -------------------------------------------------
function packAll() { // cartons are paid out of the delivery, so packing never needs cash on hand
  const n = state.store.length;
  if (!n) { sfx.bad(); return; }
  state.packQ.push(...state.store.splice(0, n)); sfx.click();
}
function shipAll() {
  if (state.truck.st !== 'dock' || !state.packed.length) { sfx.bad(); return; }
  const v = state.packed.reduce((a, b) => a + b, 0);
  state.truck = { st: 'away', t: 0, value: v, n: state.packed.length };
  state.packed = []; state.stats.shipped++; sfx.van();
  fx(105, 180, `Lieferwagen fährt: ${state.truck.n} Pakete`, '#ffd98a');
}
function upgradeStore() {
  if (spend('Lager', storeUpPrice(), `Lager-Regal +${tune.store_cap_add} Plätze`)) { state.storeLvl++; sfx.buy(); fx(105, 520, `Lager: ${storeCap()} Plätze`, '#7ee08f'); }
}
function buyAutoShip() {
  if (state.autoShip) return;
  if (spend('Automatik', tune.auto_ship_price, 'Auto-Versand (Förderband)')) { state.autoShip = true; state.stats.autos++; sfx.buy(); fx(105, 200, 'Auto-Versand!', '#ffd166'); }
}
function updateLogistics(dt) {

function afterPrint(p) {
  if (p.maintQueued || (p.autoMaint && p.wear >= tune.auto_maint_at)) {
    const robot = !p.maintQueued; p.maintQueued = false;
    if (startMaint(p, robot ? `Roboter-Wartung #${p.slot + 1}` : undefined)) return;
  }
  p.status = 'idle';
  if (p.auto) tryStart(p);
}
function deposit(p, item) {
  if (state.store.length >= storeCap()) return false;
  state.store.push(item);
  const sp = slotPos(p.slot), n = state.store.length - 1;
  state.flying.push({ id: item.id, c: item.c, x0: sp.bx, y0: sp.by - 40, x1: rackSlot(n).x, y1: rackSlot(n).y, t: 0 });
  return true;
}
function finishPrint(p) {
  const o = objDef(p.cur.job), f = filDef(p.cur.fil);
  const wearFail = p.wear > tune.wear_fail_start ? (p.wear - tune.wear_fail_start) / (100 - tune.wear_fail_start) * tune.wear_fail_add : 0;
  state.today.prints++;
  const item = { id: o.id, c: f.color, v: o.price * f.value };
  p.prog = 0; p.cur = null;
  if (rng() < f.fail + wearFail) {
    state.stats.fails++; state.today.fails++;
    fxAt(p, 'Fehldruck! −' + o.g + ' g', '#ff6b6b'); ledger(`Fehldruck #${p.slot + 1}: ${o.name}`, 0); sfx.fail();
    events.push({ type: 'misprint', slot: p.slot });
    afterPrint(p); return;
  }
  state.stats.prints++; state.stats.byFil[f.id]++;
  events.push({ type: 'printed', slot: p.slot, value: item.v });
  if (deposit(p, item)) { fxAt(p, `${OBJ_SHORT[o.id]} ins Lager (${eur(item.v)})`, '#cfe9d4'); sfx.done(); afterPrint(p); }
  else { p.held = item; p.status = 'held'; p.why = 'Lager voll'; fxAt(p, 'Lager voll!', '#ff9b5b'); sfx.bad(); }
}
function clog(p) {
  p.status = 'clog'; p.prog = 0; p.cur = null; p.maintQueued = false;
  state.stats.clogs++; state.today.clogs++;
  fxAt(p, 'Verstopft!', '#ff6b6b'); ledger(`Drucker #${p.slot + 1} verstopft`, 0); sfx.clog();
  events.push({ type: 'clog', slot: p.slot });
}
function updatePrinter(p, dt) {
  const td = tierDef(p.tier);
  if (p.status === 'print') {
    const o = objDef(p.cur.job);
    p.prog += dt * td.speed / o.time;
    p.wear = Math.min(100, p.wear + td.wear * dt);
    if (p.autoMaint && p.wear >= tune.auto_maint_at && state.money >= td.maint) p.maintQueued = true;
    if (p.wear >= 100) { clog(p); return; }
    if (p.wear > tune.wear_clog_start) {
      const h = tune.clog_rate * (p.wear - tune.wear_clog_start) / (100 - tune.wear_clog_start);
      if (rng() < h * dt) { clog(p); return; }
    }
    if (p.prog >= 1) finishPrint(p);
  } else if (p.status === 'maint') {
    p.timer += dt;
    if (p.timer >= tune.maint_time) { p.wear = 0; p.status = 'idle'; sfx.fixed(); if (p.auto) tryStart(p); }
  } else if (p.status === 'repair') {
    p.timer += dt;
    if (p.timer >= tune.repair_time) { p.wear = tune.repair_wear; p.status = 'idle'; sfx.fixed(); if (p.auto) tryStart(p); }
  } else if (p.status === 'held') {
    if (deposit(p, p.held)) { p.held = null; p.why = ''; afterPrint(p); }
  } else if (p.status === 'wait' && p.auto) {
    tryStart(p);
  } else if (p.status === 'idle' && p.autoMaint && p.wear >= tune.auto_maint_at) {

}

function canAct() {

  const cheapest = Math.min(...FIL.filter(f => FIL_TIER[f] <= maxTier()).map(f => filDef(f).price));
  for (const p of state.printers) {
    if (p.status === 'held') return true;
    if (p.status === 'clog') { if (state.money >= tierDef(p.tier).repair) return true; continue; }
    for (const o of OBJ) if (state.plans[o] && OBJ_TIER[o] <= p.tier && p.spool.g >= objDef(o).g) return true;

}

  state.summary = { day: state.day, inc: state.today.inc, out: Object.assign({}, state.today.out), rent, total: out,

// ---- PLAYER (client side in Roblox: the character and its prompts) --------------------------------
function blocked(x, y) {
  const r = 9;
  if (x < BOUNDS[0] || x > BOUNDS[2] || y < BOUNDS[1] || y > BOUNDS[3]) return true;
  for (const f of FOOT) if (x > f[0] - r && x < f[2] + r && y > f[1] - r / 2 && y < f[3] + r / 2) return true;
  return false;
}
function movePlayer(dt) {
  const pl = state.player;
  let dx = 0, dy = 0;
  if (held('KeyA') || held('ArrowLeft')) dx--;
  if (held('KeyD') || held('ArrowRight')) dx++;
  if (held('KeyW') || held('ArrowUp')) dy--;
  if (held('KeyS') || held('ArrowDown')) dy++;
  if (dx || dy) pl.to = null;
  else if (pl.to) {
    const vx = pl.to.x - pl.x, vy = pl.to.y - pl.y, d = Math.hypot(vx, vy);
    if (d < 4) pl.to = null; else { dx = vx / d; dy = vy / d; }
  }
  const len = Math.hypot(dx, dy);
  pl.moving = len > 0;
  if (!len) return;
  const sp = tune.walk_speed * dt / len;
  const nx = pl.x + dx * sp, ny = pl.y + dy * sp;
  let movedAny = false;
  if (!blocked(nx, pl.y)) { pl.x = nx; movedAny = true; }
  if (!blocked(pl.x, ny)) { pl.y = ny; movedAny = true; }
  if (!movedAny && pl.to) pl.to = null;
  if (dx) pl.dir = dx > 0 ? 1 : -1;
  pl.walk += dt * 10;
}
function findNear() {
  const pl = state.player; let best = null, bd = tune.interact_range;
  for (let i = 0; i < 8; i++) {
    const s = slotPos(i), d = Math.hypot(pl.x - s.px, pl.y - s.py);
    if (d < bd) { bd = d; best = printerAt(i) ? { kind: 'printer', slot: i } : { kind: 'slot', slot: i }; }
  }
  for (const k in STATION) {
    const s = STATION[k], d = Math.hypot(pl.x - s.px, pl.y - s.py);
    if (d < bd) { bd = d; best = { kind: k }; }
  }
  return best;
}
// the prompts on the thing the player stands at: [key, label, action, enabled]
function prompts() {

    const p = printerAt(n.slot), td = tierDef(p.tier), f = filDef(p.fil);
    const out = [['E', p.auto ? 'Stopp' : 'Start', () => toggleRun(p), true],
      ['F', `${f.name} +${tune.pack_grams} g (${eur(f.price)})`, () => refill(p), state.money >= f.price]];
    if (p.status === 'clog') out.push(['R', `Reparieren (${eur(td.repair)})`, () => doRepair(p), state.money >= td.repair]);
    else out.push(['R', p.maintQueued ? 'Wartung geplant' : `Wartung (${eur(td.maint)})`, () => doMaint(p), state.money >= td.maint && p.status !== 'maint' && p.status !== 'repair']);
    return out;
  }
  if (n.kind === 'slot') return state.printers.length < 8 ? [['E', `Drucker kaufen (${eur(nextPrice())})`, () => buyPrinter(n.slot), state.money >= nextPrice()]] : [];
  if (n.kind === 'pack') return [['E', `Alles verpacken (${state.store.length} Teile)`, packAll, state.store.length > 0]];
  if (n.kind === 'ship') {

}
function pressPrompt(key) {

}
function hintNow() {

function updatePlay(dt) {

  card(838, 472, 436, 84, 'Betrieb');
  const full = state.store.length >= storeCap();
  text(`Lager ${state.store.length}/${storeCap()}`, 850, 500, 13, full ? '#ff8a8a' : '#f1f4f7', 'left', 'bold');
  text(`Packtisch ${state.packQ.length ? 'packt ' + state.packQ.length : 'frei'}`, 970, 500, 13, '#f1f4f7', 'left', 'bold');
  text(`Pakete ${state.packed.length}`, 1110, 500, 13, '#f1f4f7', 'left', 'bold');
  text(state.truck.st === 'dock' ? 'Lieferwagen: am Tor' : `Lieferwagen: zurück in ${Math.ceil(tune.ship_time - state.truck.t)} s (${eur(state.truck.value)})`, 850, 524, 12, '#c6cdd5', 'left');
  text(state.autoShip ? 'Auto-Versand: an' : 'Auto-Versand: nein', 1262, 524, 12, state.autoShip ? '#7ee08f' : '#9aa5b1', 'right');
  bar(850, 538, 412, 6, state.store.length / storeCap(), full ? '#e5484d' : '#5ab0ff');
  // goals
  card(838, 562, 436, 152, 'Ziele');
  const rows = [['Jetzt', goal(state.ms)], ['Nächstes', goal(state.ms + 1)], ['Groß', bigGoal(state.big)]];
  rows.forEach(([lab, g], i) => {
    const y = 586 + i * 42, pr = g.p(), near = pr >= 0.75 && pr < 1 && i !== 1;
    text(lab, 850, y + 6, 12, i === 0 ? '#ffd98a' : '#9aa5b1', 'left', 'bold');
    text(g.t(), 920, y + 6, 13, '#f1f4f7', 'left', i === 0 ? 'bold' : '');
    text(`+${eur(g.r)}`, 1262, y + 6, 12, '#7ee08f', 'right', 'bold');
    bar(920, y + 18, 270, 8, pr, i === 1 ? '#6d7886' : near ? `rgba(255,209,102,${0.7 + 0.3 * Math.sin(anim * 8)})` : '#4cc36a');
    text(near ? 'fast geschafft!' : pct(pr), 1262, y + 22, 12, near ? '#ffd166' : '#9aa5b1', 'right', near ? 'bold' : '');
  });
  for (const c of state.confetti) { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); rect(-4, -2, 8, 4, c.c); ctx.restore(); }
}
function drawLedger() {
  state.ledger.slice(0, 3).forEach((l, i) => {
    const x = 10 + i * 272, y = 688;
    fillRR(x, y, 264, 26, 6, 'rgba(25,28,33,0.82)');
    const c = l.amt > 0 ? '#7ee08f' : l.amt < 0 ? '#ff8a8a' : '#f3b25b';
    text(l.amt === 0 ? '±0 €' : (l.amt > 0 ? '+' : '') + eur(l.amt), x + 10, y + 13, 13, c, 'left', 'bold');
    ctx.font = `12px ${FONT}`; let s = l.text; while (ctx.measureText(s).width > 170 && s.length > 4) s = s.slice(0, -2);
    if (s !== l.text) s += '…';
    text(s, x + 84, y + 13, 12, '#d6dce2', 'left');
  });
}

// ---- Scenes ----------------------------------------------------------------------------------
function drawPlay() { ui = []; clear('#15181c'); drawFloorView(); drawLedger(); drawHUD(); drawPanel(); }
function overlay(x, y, w, h) { rect(0, 0, W, H, 'rgba(10,12,15,0.6)'); fillRR(x, y, w, h, 14, '#262c34'); rr(x, y, w, h, 14); ctx.strokeStyle = '#4a5260'; ctx.lineWidth = 2; ctx.stroke(); }
const demoP = { tier: 1, status: 'print', prog: 0, wear: 20, job: 'dragon', fil: 'petg', spool: { type: 'petg', g: 200 }, slot: 2, cur: { job: 'dragon', fil: 'petg' } };
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      ui = []; clear('#2a2f36'); rect(0, 300, W, 420, '#ad7d4c');
      text('Druckfarm: alle Figuren', W / 2, 24, 20, '#fff', 'center', 'bold');
      const sp = t => ({ type: t, g: 200 });
      const ps = [
        [{ tier: 0, status: 'print', prog: 0.6, wear: 10, job: 'key', spool: sp('cheap'), slot: 0, cur: { job: 'key', fil: 'cheap' } }, 'Starter-Drucker'],
        [{ tier: 1, status: 'print', prog: 0.6, wear: 10, job: 'holder', spool: sp('plus'), slot: 1, cur: { job: 'holder', fil: 'plus' } }, 'Pro-Drucker'],
        [{ tier: 2, status: 'print', prog: 0.6, wear: 10, job: 'drone', spool: sp('resin'), slot: 2, cur: { job: 'drone', fil: 'resin' } }, 'Industrie-Drucker'],
        [{ tier: 0, status: 'clog', prog: 0, wear: 100, job: 'dragon', spool: sp('plus'), slot: 3 }, 'Verstopft (Spaghetti)'],
      ];
      ps.forEach(([p, n], i) => { const x = 110 + i * 200; drawPrinter(p, x, 250, 0.9); text(n, x, 274, 14, '#fff', 'center', 'bold'); });
      drawRobot(880, 250, true); text('Wartungs-Roboter', 880, 274, 14, '#fff', 'center', 'bold');
      drawFeeder(1052, 250, FIL_COLOR.petg, true); text('Filament-Zuführung', 1052, 274, 14, '#fff', 'center', 'bold');
      drawPlayer({ x: 1180, y: 250, dir: 1, walk: 1, moving: true }, 1.6); text('Spieler', 1180, 274, 14, '#fff', 'center', 'bold');
      OBJ.forEach((o, i) => { const x = 110 + i * 150; drawObj(o, x, 400, 2.2, 1, FIL_COLOR[FIL[i % 4]]); text(OBJ_NAME[o], x, 426, 13, '#fff', 'center', 'bold'); });
      drawBox(1000, 400, 3); text('Paket', 1000, 426, 13, '#fff', 'center', 'bold');
      FIL.forEach((f, i) => { const x = 110 + i * 150; drawSpool(x, 520, 24, FIL_COLOR[f], 0.8); text(FIL_NAME[f] + '-Spule', x, 560, 13, '#fff', 'center', 'bold'); });
      drawVan(760, 660, 0.9, 4); text('Lieferwagen', 760, 686, 13, '#fff', 'center', 'bold');
      ctx.save(); ctx.translate(860, 150); drawPackTable(); ctx.restore(); text('Packtisch', 962, 660, 13, '#fff', 'center', 'bold');
      ctx.save(); ctx.translate(1060, 20); drawRack(); ctx.restore(); text('Lager-Regal', 1162, 700, 13, '#fff', 'center', 'bold');
    },
  },
  title: {
    update() {
      handleClicks();
      if (pressed('Enter') || pressed('Space')) { const s = loadSave(); if (s) continueGame(s); else { reset(); scene = 'play'; } }
      if (pressed('KeyN')) { clearSave(); reset(); scene = 'play'; }
    },
    draw() {
      ui = [];
      clear('#15181c'); drawWall();
      rect(830, 56, 450, 664, '#ad7d4c'); rect(0, 0, W, 56, '#1f2329');
      demoP.prog = (anim / 14) % 1; drawBench(860, 600, false, false); drawPrinter(demoP, 860 + BW / 2 + BS / 2, 589, 1);
      drawPlayer({ x: 1150, y: 640, dir: -1, walk: anim * 10, moving: false }, 1.8);
      fillRR(60, 270, 560, 400, 16, 'rgba(24,28,34,0.92)');
      text(TITLE, 340, 316, 56, '#ffd98a', 'center', 'bold');
      text('Ein 3D-Drucker-Business von der Garage zur Farm', 340, 358, 16, '#d6dce2');
      const lines = ['Lauf zu deinen Druckern: jeder braucht eigenes Filament und Wartung',
        'Fertige Teile kommen ins Lager: verpacken, verschicken, kassieren',
        'Billiges Filament = mehr Fehldrucke, gutes = mehr Wert',
        'Wartung ist billig, Verstopfung teuer',
        'Später automatisieren: Wartungs-Roboter, Zuführung, Auto-Versand',
        'Miete am Tagesende: zweimal im Minus = Pleite'];
      lines.forEach((l, i) => text(l, 90, 396 + i * 24, 14, '#c6cdd5', 'left'));
      const s = loadSave();
      button(90, 552, 220, 50, 'Neues Spiel', () => { clearSave(); reset(); scene = 'play'; }, { bg: '#2f8a4c', size: 17, sub: 'Enter / Klick' });
      if (s) button(330, 552, 240, 50, `Weiter: Tag ${s.day}`, () => continueGame(s), { bg: '#2d6cad', size: 17, sub: eur(s.money) });
      text('Laufen: WASD oder Pfeiltasten · E: Aktion am Drucker oder an der Station', 340, 628, 13, '#9aa5b1');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      handleClicks();
      const n = state.near, p = n && n.kind === 'printer' ? printerAt(n.slot) : null;
      if (pressed('KeyE') || pressed('Space') || pressed('Enter')) pressPrompt('E');
      if (pressed('KeyF')) { if (p) refill(p); else pressPrompt('F'); }
      if (pressed('KeyR') && p) doMaint(p);
      if (pressed('KeyQ') && p) cycleFil(p);
      if (pressed('KeyT') && p) cycleJob(p);
      if (pressed('KeyU') && p) doUpgrade(p);
      updatePlay(dt);
    },
    draw: drawPlay,
  },
  pause: {
    update() { handleClicks(); if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    anyClick() { scene = 'play'; },
    draw() { drawPlay(); ui = []; overlay(440, 280, 400, 140); text('Pause', 640, 330, 40, '#fff', 'center', 'bold'); text('P oder Klick: weiter', 640, 380, 16, '#c6cdd5'); },
  },
  summary: {
    update() { handleClicks(); if (pressed('Enter') || pressed('Space')) scene = 'play'; },
    draw() {
      drawPlay(); ui = [];
      const s = state.summary; overlay(360, 100, 560, 520);
      text(`Tag ${s.day} vorbei`, 640, 140, 30, '#ffd98a', 'center', 'bold');
      text('Einnahmen (Lieferungen + Ziele)', 400, 182, 15, '#7ee08f', 'left', 'bold'); text('+' + eur(s.inc), 880, 182, 15, '#7ee08f', 'right', 'bold');
      let y = 212;
      text('Ausgaben', 400, y, 15, '#ff9b9b', 'left', 'bold'); y += 24;
      for (const [k, v] of Object.entries(s.out)) { if (v <= 0) continue; text(k, 420, y, 14, '#d6dce2', 'left'); text('−' + eur(v).replace('−', ''), 880, y, 14, '#ff9b9b', 'right'); y += 21; }
      text('Miete + Strom', 420, y, 14, '#d6dce2', 'left'); text('−' + eur(s.rent), 880, y, 14, '#ff9b9b', 'right'); y += 28;
      rect(400, y - 12, 480, 1, '#4a5260');
      text('Gewinn heute', 400, y + 4, 17, '#fff', 'left', 'bold'); text((s.profit >= 0 ? '+' : '') + eur(s.profit), 880, y + 4, 17, s.profit >= 0 ? '#7ee08f' : '#ff6b6b', 'right', 'bold');
      y += 34;
      text(`Gedruckt: ${s.prints - s.fails} · Fehldrucke: ${s.fails} · Verstopfungen: ${s.clogs} · verschickt: ${s.shipped}`, 640, y, 13, '#c6cdd5'); y += 24;
      text(`Kasse jetzt: ${eur(state.money)} · Miete morgen: ${eur(rentToday())}`, 640, y, 13, '#c6cdd5');
      if (s.warn) text('MAHNUNG: Du bist im Minus. Beende den nächsten Tag im Plus, sonst Pleite!', 640, 548, 14, '#ff6b6b', 'center', 'bold');
      else text('Gespeichert.', 640, 548, 13, '#9aa5b1');
      button(540, 566, 200, 40, 'Weiter', () => { scene = 'play'; }, { bg: '#2f8a4c', size: 16 });
    },
  },
  over: {
    update() { handleClicks(); if (pressed('KeyR') || pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      drawPlay(); ui = [];
      overlay(340, 200, 600, 300);
      text('Pleite!', 640, 250, 48, '#ff6b6b', 'center', 'bold');
      text(state.overReason, 640, 305, 15, '#f1f4f7');
      text(state.gained, 640, 340, 15, '#c6cdd5');
      text(`Gedruckt: ${state.stats.prints} · Fehldrucke: ${state.stats.fails} · Verstopfungen: ${state.stats.clogs} · Lieferungen: ${state.stats.shipped}`, 640, 370, 13, '#9aa5b1');
      button(520, 410, 240, 50, 'Neue Werkstatt', () => { reset(); scene = 'play'; }, { bg: '#2f8a4c', size: 17, sub: 'R / Enter / Klick' });
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  anim += STEP;
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
