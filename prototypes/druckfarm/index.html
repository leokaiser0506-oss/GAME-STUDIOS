<html lang="de">
<head>
<meta charset="utf-8">

<title>Druckfarm</title>
<style>
  html, body { margin: 0; height: 100%; background: #15181c; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  canvas { display: block; margin: 0 auto; touch-action: none; }

<body>
<canvas id="game"></canvas>
<script src="config.js"></script>
<script>
'use strict';
// Druckfarm: a 3D-printer business tycoon. Buy filament, print, sell, maintain, expand.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const TITLE = 'Druckfarm';
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VIEW = { s: 1, left: 0, top: 0 };
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = k, r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function fillRR(x, y, w, h, r, c) { rr(x, y, w, h, r); ctx.fillStyle = c; ctx.fill(); }
function poly(pts, c, stroke) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function ell(x, y, rx, ry, c) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function eur(n) {
  const neg = n < 0, v = Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '−' : '') + v + ' €';
}
function pct(f) { return Math.round(f * 100) + ' %'; }
function num(f, d = 1) { return f.toFixed(d).replace('.', ','); }

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
const mouse = { x: -1, y: -1, in: false, downAt: null, drag: false };
const clicks = [];
function toLogical(e) {
  const b = canvas.getBoundingClientRect();
  return { x: (e.clientX - b.left) / b.width * W, y: (e.clientY - b.top) / b.height * H };
}
canvas.addEventListener('pointerdown', e => {
  startAudio(); const p = toLogical(e);
  mouse.downAt = { x: p.x, y: p.y, cx: cam.cx, cy: cam.cy }; mouse.drag = false;
});
canvas.addEventListener('pointermove', e => {
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true;
  if (mouse.downAt && inFloor(mouse.downAt) && cam.zoom > 1.001) {
    const dx = p.x - mouse.downAt.x, dy = p.y - mouse.downAt.y;
    if (Math.hypot(dx, dy) > 6) mouse.drag = true;
    if (mouse.drag) { cam.cx = mouse.downAt.cx - dx / cam.zoom; cam.cy = mouse.downAt.cy - dy / cam.zoom; clampCam(); }
  }
});
canvas.addEventListener('pointerup', e => {
  const p = toLogical(e);
  if (mouse.downAt && !mouse.drag) clicks.push({ x: p.x, y: p.y });
  mouse.downAt = null; mouse.drag = false;
});
canvas.addEventListener('pointerleave', () => { mouse.in = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault(); const p = toLogical(e);
  if (!inFloor(p)) return;
  const before = toWorld(p.x, p.y);
  cam.zoom = clamp(cam.zoom * Math.exp(-e.deltaY * 0.0012), 1, 1.9);
  cam.cx = before.x - (p.x - FCX) / cam.zoom; cam.cy = before.y - (p.y - FCY) / cam.zoom; clampCam();
}, { passive: false });

// ---- Audio --------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {
  coin() { tone(880, 0.08, 'triangle', 0.18); tone(1320, 0.12, 'triangle', 0.15, 0.06); },
  buy() { tone(330, 0.06, 'square', 0.12); tone(220, 0.1, 'square', 0.12, 0.05); },
  click() { tone(600, 0.04, 'square', 0.08); },
  fail() { tone(200, 0.2, 'sawtooth', 0.12); },
  clog() { tone(110, 0.35, 'sawtooth', 0.2); tone(90, 0.4, 'sawtooth', 0.15, 0.15); },
  fixed() { tone(520, 0.08, 'triangle', 0.15); tone(780, 0.12, 'triangle', 0.15, 0.08); },
  goal() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'triangle', 0.18, i * 0.09)); },
  bad() { tone(160, 0.3, 'square', 0.12); },
};

// ---- Data tables (numbers come from config.js) ------------------------------------------
const FIL = ['cheap', 'plus', 'petg', 'resin'];
const FIL_NAME = { cheap: 'Billig-PLA', plus: 'PLA+', petg: 'PETG', resin: 'Resin' };
const FIL_SHORT = { cheap: 'Billig', plus: 'PLA+', petg: 'PETG', resin: 'Resin' };
const FIL_COLOR = { cheap: '#e7d3a1', plus: '#3d84f0', petg: '#1fbfa2', resin: '#a45cf2' };
const FIL_TIER = { cheap: 0, plus: 0, petg: 1, resin: 2 };
function filDef(id) {
  return { id, name: FIL_NAME[id], color: FIL_COLOR[id], tier: FIL_TIER[id],
    price: tune[`fil_${id}_price`], fail: tune[`fil_${id}_fail`], value: tune[`fil_${id}_value`] };
}
const OBJ = ['key', 'holder', 'dragon', 'gear', 'helmet', 'drone'];
const OBJ_NAME = { key: 'Schlüsselanhänger', holder: 'Handyhalter', dragon: 'Drachenfigur', gear: 'Zahnrad-Ersatzteil', helmet: 'Cosplay-Helm', drone: 'Drohnenrahmen' };
const OBJ_SHORT = { key: 'Anhänger', holder: 'Handyhalter', dragon: 'Drache', gear: 'Zahnrad', helmet: 'Helm', drone: 'Drohne' };
const OBJ_TIER = { key: 0, holder: 0, dragon: 0, gear: 1, helmet: 1, drone: 2 };
const OBJ_H = { key: 11, holder: 26, dragon: 34, gear: 34, helmet: 38, drone: 18 };
function objDef(id) {
  return { id, name: OBJ_NAME[id], tier: OBJ_TIER[id], h: OBJ_H[id],
    g: tune[`obj_${id}_g`], time: tune[`obj_${id}_time`], price: tune[`obj_${id}_price`], plan: tune[`obj_${id}_plan`] };
}
const TIER_NAME = ['Starter', 'Pro', 'Industrie'];
const TIER_KEY = ['starter', 'pro', 'ind'];
function tierDef(t) {
  const k = TIER_KEY[t];
  return { name: TIER_NAME[t], speed: tune[`pr_${k}_speed`], wear: tune[`pr_${k}_wear`],
    maint: tune[`pr_${k}_maint`], repair: tune[`pr_${k}_repair`],
    upgrade: t === 0 ? tune.pr_pro_upgrade : t === 1 ? tune.pr_ind_upgrade : 0 };
}

// ---- Layout --------------------------------------------------------------------------------
const FX0 = 0, FY0 = 56, FW = 830, FH = 664, FCX = FX0 + FW / 2, FCY = FY0 + FH / 2;
const BW = 165, BD = 34, BS = 24; // bench width, depth, skew
const cam = { zoom: 1, cx: FCX, cy: FCY };
function clampCam() {
  const hw = FW / 2 / cam.zoom, hh = FH / 2 / cam.zoom;
  cam.cx = clamp(cam.cx, FX0 + hw, FX0 + FW - hw); cam.cy = clamp(cam.cy, FY0 + hh, FY0 + FH - hh);
}
function inFloor(p) { return p.x >= FX0 && p.x < FX0 + FW && p.y >= FY0 && p.y < FY0 + FH; }
function toWorld(x, y) { return { x: (x - FCX) / cam.zoom + cam.cx, y: (y - FCY) / cam.zoom + cam.cy }; }
function slotPos(i) {
  const row = i < 4 ? 0 : 1, col = i % 4;
  const x0 = (row === 0 ? 62 : 32) + col * 190, ty = row === 0 ? 380 : 600;
  return { x0, ty, bx: x0 + BW / 2 + BS / 2, by: ty - BD / 2 + 4 };
}
function inSlot(i, w) {
  const s = slotPos(i);
  return w.x >= s.x0 - 4 && w.x <= s.x0 + BW + BS + 4 && w.y >= s.ty - 200 && w.y <= s.ty + 30;
}
const SHELF_Y = 198;

// ---- State ---------------------------------------------------------------------------------
const SAVE_KEY = 'druckfarm-save-v1';
let scene, state, anim = 0, ui = [];
function newPrinter(slot, tier = 0) {
  return { slot, tier, wear: 0, job: 'key', fil: 'cheap', status: 'idle', prog: 0, timer: 0,
    auto: false, maintQueued: false, cur: null, why: '' };
}
function freshToday() {
  return { inc: 0, out: { Filament: 0, Wartung: 0, Reparatur: 0, Drucker: 0, Baupläne: 0, Upgrades: 0 }, prints: 0, fails: 0, clogs: 0 };
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = {
    t: 0, score: 0, gained: '',
    money: tune.start_money, day: 1, dayT: 0, warn: false,
    stock: { cheap: tune.start_filament, plus: 0, petg: 0, resin: 0 },
    printers: [newPrinter(0)], sel: 0,
    plans: { key: true, holder: false, dragon: false, gear: false, helmet: false, drone: false },
    stats: { prints: 0, fails: 0, clogs: 0, maint: 0, repairs: 0, earned: 0, bestDay: 0, bought: 0,
      byFil: { cheap: 0, plus: 0, petg: 0, resin: 0 } },
    today: freshToday(), ledger: [], ms: 0, big: 0, summary: null, stuckT: 0, started: false,
    fx: [], flying: [], shelf: [], confetti: [], banner: null, overReason: '',
  };
  cam.zoom = 1; cam.cx = FCX; cam.cy = FCY;
}
function save() {
  try {
    const s = Object.assign({}, state, { fx: [], flying: [], confetti: [], banner: null, seedNow: seed });
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  } catch (e) { /* storage blocked: the game plays without saving */ }
}
function loadSave() {
  try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }
function continueGame(s) {
  reset(); Object.assign(state, s); if (s.seedNow) seed = s.seedNow;
  state.fx = []; state.flying = []; state.confetti = []; state.banner = null; scene = 'play';
}

// ---- Economy helpers ----------------------------------------------------------------------
const maxTier = () => state.printers.reduce((m, p) => Math.max(m, p.tier), 0);
const nextPrice = () => Math.round(tune.printer_base_price * Math.pow(tune.printer_price_growth, state.printers.length - 1));
const rentToday = () => Math.round((tune.rent_base + tune.rent_per_printer * state.printers.length) * Math.pow(tune.rent_growth, state.day - 1));
const filUnlocked = f => FIL_TIER[f] <= maxTier();
function ledger(textS, amt) {
  state.ledger.unshift({ text: textS, amt, t: state.t });
  if (state.ledger.length > 6) state.ledger.pop();
}
function spend(cat, amt, label) {
  if (state.money < amt) { sfx.bad(); return false; }
  state.money -= amt; state.today.out[cat] = (state.today.out[cat] || 0) + amt; ledger(label, -amt); return true;
}
function earn(amt, label) {
  state.money += amt; state.today.inc += amt; state.stats.earned += amt; state.score = Math.round(state.stats.earned);
  ledger(label, amt);
}
function fx(x, y, s, c) { state.fx.push({ x, y, s, c, t: 0, life: 1.5 }); }
function headPos(p) { const s = slotPos(p.slot); return { x: s.bx, y: s.by - 110 }; }

// ---- Actions ---------------------------------------------------------------------------------
function tryStart(p) {
  const o = objDef(p.job), f = filDef(p.fil);
  if (!state.plans[p.job] || o.tier > p.tier || f.tier > p.tier) { p.status = 'wait'; p.why = 'Auftrag passt nicht'; return false; }
  if (state.stock[p.fil] < o.g) { p.status = 'wait'; p.why = 'Kein ' + f.name; return false; }
  state.stock[p.fil] -= o.g; p.status = 'print'; p.prog = 0; p.cur = { job: p.job, fil: p.fil }; p.why = '';
  return true;
}
function toggleRun(p) {
  if (!p) return;
  state.started = true;
  if (p.auto) { p.auto = false; if (p.status === 'wait') p.status = 'idle'; sfx.click(); return; }
  p.auto = true; sfx.click();
  if (p.status === 'idle' || p.status === 'wait') tryStart(p);
}
function doMaint(p) {
  if (!p || p.status === 'clog' || p.status === 'maint' || p.status === 'repair') return;
  const c = tierDef(p.tier).maint;
  if (p.status === 'print') { if (state.money >= c) { p.maintQueued = !p.maintQueued; sfx.click(); } else sfx.bad(); return; }
  if (!spend('Wartung', c, `Wartung Drucker #${p.slot + 1}`)) return;
  p.status = 'maint'; p.timer = 0; state.stats.maint++; sfx.click();
}
function doRepair(p) {
  if (!p || p.status !== 'clog') return;
  if (!spend('Reparatur', tierDef(p.tier).repair, `Reparatur Drucker #${p.slot + 1}`)) return;
  p.status = 'repair'; p.timer = 0; state.stats.repairs++; sfx.click();
}
function doUpgrade(p) {
  if (!p || p.tier >= 2 || p.status === 'print' || p.status === 'maint' || p.status === 'repair') return;
  const t = tierDef(p.tier);
  if (!spend('Upgrades', t.upgrade, `Upgrade #${p.slot + 1} auf ${TIER_NAME[p.tier + 1]}`)) return;
  p.tier++; p.wear = 0; p.status = 'idle'; sfx.buy();
  const s = slotPos(p.slot); fx(s.bx, s.by - 150, TIER_NAME[p.tier] + '!', '#ffd166');
  if (p.auto) tryStart(p);
}
function buyPrinter(slot) {
  if (state.printers.length >= 8 || state.printers.some(p => p.slot === slot)) return;
  const price = nextPrice();
  if (!spend('Drucker', price, `Neuer Drucker #${slot + 1}`)) return;
  const sel = state.printers[state.sel];
  const np = newPrinter(slot);
  if (sel) { np.job = OBJ_TIER[sel.job] === 0 ? sel.job : 'key'; np.fil = FIL_TIER[sel.fil] === 0 ? sel.fil : 'cheap'; }
  state.printers.push(np); state.sel = state.printers.length - 1; sfx.buy();
  const s = slotPos(slot); fx(s.bx, s.by - 120, 'Neuer Drucker!', '#7ee08f');
}
function buyFil(f) {
  if (!filUnlocked(f)) return;
  if (!spend('Filament', filDef(f).price, `${FIL_NAME[f]} +${tune.pack_grams} g`)) return;
  state.stock[f] += tune.pack_grams; state.stats.bought++; sfx.buy();
}
function buyPlan(o) {
  if (state.plans[o]) return;
  if (!spend('Baupläne', objDef(o).plan, `Bauplan ${OBJ_NAME[o]}`)) return;
  state.plans[o] = true; sfx.buy();
}
function chooseJob(p, o) {
  if (!state.plans[o]) { buyPlan(o); if (!state.plans[o]) return; }
  if (OBJ_TIER[o] > p.tier) { sfx.bad(); return; }
  p.job = o; sfx.click();
  if (p.status === 'wait' && p.auto) tryStart(p);
}
function chooseFil(p, f) {
  if (FIL_TIER[f] > p.tier) { sfx.bad(); return; }
  p.fil = f; sfx.click();
  if (p.status === 'wait' && p.auto) tryStart(p);
}

// ---- Goals -------------------------------------------------------------------------------------
const cnt = n => Math.min(1, state.printers.length / n);
const afford = c => Math.min(0.99, Math.max(0, state.money) / c);
const MS = [
  { t: () => 'Kauf deinen zweiten Drucker', p: () => state.printers.length >= 2 ? 1 : afford(nextPrice()), r: 25 },
  { t: () => 'Mach eine Wartung', p: () => state.stats.maint >= 1 ? 1 : 0, r: 15 },
  { t: () => 'Kauf den Bauplan „Handyhalter“', p: () => state.plans.holder ? 1 : afford(tune.obj_holder_plan), r: 30 },
  { t: () => 'Besitze 3 Drucker', p: () => cnt(3), r: 50 },
  { t: () => 'Rüste einen Drucker auf Pro auf', p: () => maxTier() >= 1 ? 1 : afford(tune.pr_pro_upgrade), r: 80 },
  { t: () => 'Drucke 10 Teile aus PETG', p: () => Math.min(1, state.stats.byFil.petg / 10), r: 100 },
  { t: () => 'Besitze 5 Drucker', p: () => cnt(5), r: 150 },
  { t: () => 'Kauf den Bauplan „Cosplay-Helm“', p: () => state.plans.helmet ? 1 : afford(tune.obj_helmet_plan), r: 200 },
  { t: () => 'Stell einen Industrie-Drucker auf', p: () => maxTier() >= 2 ? 1 : afford(tune.pr_ind_upgrade), r: 400 },
  { t: () => 'Besitze 8 Drucker: volle Druckfarm', p: () => cnt(8), r: 600 },
  { t: () => 'Drucke 20 Teile aus Resin', p: () => Math.min(1, state.stats.byFil.resin / 20), r: 800 },
];
function goal(i) {
  if (i < MS.length) return MS[i];
  const X = tune.daily_goal_base * Math.pow(2, i - MS.length);
  return { t: () => `Verdiene ${eur(X)} an einem Tag`, p: () => Math.min(1, state.today.inc / X), r: Math.round(X * 0.15) };
}
function bigGoal(i) {
  const X = [1000, 5000, 25000, 100000][i] || 100000 * Math.pow(4, i - 3);
  return { t: () => `Verdiene insgesamt ${eur(X)}`, p: () => Math.min(1, state.stats.earned / X), r: Math.round(X * tune.big_goal_reward) };
}
function checkGoals() {
  const g = goal(state.ms);
  if (g.p() >= 1) { celebrate(g.t(), g.r); state.ms++; return; }
  const b = bigGoal(state.big);
  if (b.p() >= 1) { celebrate(b.t(), b.r); state.big++; }
}
function celebrate(label, reward) {
  state.money += reward; state.today.inc += reward; ledger('Ziel: ' + label, reward);
  state.banner = { s: `Ziel geschafft: ${label}  +${eur(reward)}`, t: 0, c: '#2f9e55' };
  for (let i = 0; i < 50; i++) state.confetti.push({ x: 1050 + (rng() - 0.5) * 380, y: 570, vx: (rng() - 0.5) * 260, vy: -120 - rng() * 260, c: ['#ffd166', '#7ee08f', '#5ab0ff', '#ff7b9c'][i % 4], t: 0, r: rng() * 6 });
  sfx.goal();
}

// ---- Simulation -------------------------------------------------------------------------------
function finishPrint(p) {
  const o = objDef(p.cur.job), f = filDef(p.cur.fil);
  const wearFail = p.wear > tune.wear_fail_start ? (p.wear - tune.wear_fail_start) / (100 - tune.wear_fail_start) * tune.wear_fail_add : 0;
  const s = slotPos(p.slot);
  state.today.prints++;
  if (rng() < f.fail + wearFail) {
    state.stats.fails++; state.today.fails++;
    fx(s.bx, s.by - 130, 'Fehldruck! −' + o.g + ' g', '#ff6b6b'); ledger(`Fehldruck #${p.slot + 1}: ${o.name}`, 0); sfx.fail();
    events.push({ type: 'misprint', slot: p.slot });
  } else {
    const value = o.price * f.value;
    earn(value, `${o.name} (${FIL_SHORT[f.id]}) #${p.slot + 1}`);
    state.stats.prints++; state.stats.byFil[f.id]++;
    fx(s.bx, s.by - 130, '+' + eur(value), '#7ee08f'); sfx.coin();
    const slotN = state.shelf.length % 8;

    draw() {
      ui = [];
      const st = state; drawWall(); state = st;
      rect(0, 0, W, H, 'rgba(0,0,0,0)');
      rect(830, 56, 450, 664, '#ad7d4c'); rect(0, 0, W, 56, '#1f2329');
      demoP.prog = (anim / 14) % 1; drawBench(470, 600, false, false); drawPrinter(demoP, slotPos(4).bx + 440, 587, 0.8);
      fillRR(60, 300, 520, 360, 16, 'rgba(24,28,34,0.9)');
      text(TITLE, 320, 350, 56, '#ffd98a', 'center', 'bold');
      text('Ein 3D-Drucker-Business von der Garage zur Farm', 320, 392, 16, '#d6dce2');
      const lines = ['Filament kaufen: billig = mehr Fehldrucke, gut = mehr Wert', 'Drucken und verkaufen geht automatisch in Schleife', 'Verschleiß im Blick: Wartung ist billig, Verstopfung teuer', 'Mehr Drucker, bessere Drucker, neue Baupläne', 'Miete am Tagesende: zweimal im Minus = Pleite'];
      lines.forEach((l, i) => text(l, 90, 432 + i * 24, 14, '#c6cdd5', 'left'));
      const s = loadSave();
      button(90, 568, 210, 50, 'Neues Spiel', () => { clearSave(); reset(); scene = 'play'; }, { bg: '#2f8a4c', size: 17, sub: 'Enter / Klick' });
      if (s) button(320, 568, 230, 50, `Weiter: Tag ${s.day}`, () => continueGame(s), { bg: '#2d6cad', size: 17, sub: eur(s.money) });
      text('Steuerung: Maus (klicken, Mausrad zoomt) · Tasten im Spiel unten rechts erklärt', 320, 640, 12, '#9aa5b1');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      handleClicks();
      const p = state.printers[state.sel];
      for (let i = 1; i <= 8; i++) if (pressed('Digit' + i)) { const idx = state.printers.findIndex(q => q.slot === i - 1); if (idx >= 0) state.sel = idx; }
      if (pressed('Space')) toggleRun(p);
      if (pressed('KeyW')) doMaint(p);
      if (pressed('KeyR')) doRepair(p);
      if (pressed('KeyF')) buyFil(p.fil);
      if (pressed('KeyU')) doUpgrade(p);
      if (pressed('KeyB')) { for (let i = 0; i < 8; i++) if (!state.printers.some(q => q.slot === i)) { buyPrinter(i); break; } }
      updatePlay(dt);
    },
    draw: drawPlay,
  },
  pause: {
    update() { handleClicks(); if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    anyClick() { scene = 'play'; },
    draw() { drawPlay(); ui = []; overlay(440, 280, 400, 140); text('Pause', 640, 330, 40, '#fff', 'center', 'bold'); text('P oder Klick: weiter', 640, 380, 16, '#c6cdd5'); },
  },
  summary: {
    update() { handleClicks(); if (pressed('Enter') || pressed('Space')) scene = 'play'; },
    draw() {
      drawPlay(); ui = [];
      const s = state.summary; overlay(360, 120, 560, 480);
      text(`Tag ${s.day} vorbei`, 640, 160, 30, '#ffd98a', 'center', 'bold');
      text('Einnahmen', 400, 205, 15, '#7ee08f', 'left', 'bold'); text('+' + eur(s.inc), 880, 205, 15, '#7ee08f', 'right', 'bold');
      let y = 236;
      text('Ausgaben', 400, y, 15, '#ff9b9b', 'left', 'bold'); y += 26;
      for (const [k, v] of Object.entries(s.out)) { if (v <= 0) continue; text(k, 420, y, 14, '#d6dce2', 'left'); text('−' + eur(v).replace('−', ''), 880, y, 14, '#ff9b9b', 'right'); y += 22; }
      text('Miete + Strom', 420, y, 14, '#d6dce2', 'left'); text('−' + eur(s.rent), 880, y, 14, '#ff9b9b', 'right'); y += 30;
      rect(400, y - 12, 480, 1, '#4a5260');
      text('Gewinn heute', 400, y + 4, 17, '#fff', 'left', 'bold'); text((s.profit >= 0 ? '+' : '') + eur(s.profit), 880, y + 4, 17, s.profit >= 0 ? '#7ee08f' : '#ff6b6b', 'right', 'bold');
      y += 36;
      text(`Verkauft: ${s.prints - s.fails} · Fehldrucke: ${s.fails} · Verstopfungen: ${s.clogs}`, 640, y, 14, '#c6cdd5'); y += 26;
      text(`Kasse jetzt: ${eur(state.money)} · Miete morgen: ${eur(rentToday())}`, 640, y, 14, '#c6cdd5');
      if (s.warn) text('MAHNUNG: Du bist im Minus. Beende den nächsten Tag im Plus, sonst Pleite!', 640, 528, 14, '#ff6b6b', 'center', 'bold');
      else text('Gespeichert.', 640, 528, 13, '#9aa5b1');
      button(540, 548, 200, 40, 'Weiter', () => { scene = 'play'; }, { bg: '#2f8a4c', size: 16 });
    },
  },
  over: {
    update() { handleClicks(); if (pressed('KeyR') || pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      drawPlay(); ui = [];
      overlay(340, 200, 600, 300);
      text('Pleite!', 640, 250, 48, '#ff6b6b', 'center', 'bold');
      text(state.overReason, 640, 305, 15, '#f1f4f7');
      text(state.gained, 640, 340, 15, '#c6cdd5');
      text(`Gedruckt: ${state.stats.prints} · Fehldrucke: ${state.stats.fails} · Verstopfungen: ${state.stats.clogs} · Wartungen: ${state.stats.maint}`, 640, 370, 13, '#9aa5b1');
      button(520, 410, 240, 50, 'Neue Werkstatt', () => { reset(); scene = 'play'; }, { bg: '#2f8a4c', size: 17, sub: 'R / Enter / Klick' });
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  anim += STEP;
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
